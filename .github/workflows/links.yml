name: link check

# A dead link in a list of links is the defect that discredits the whole list.
on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Fails only on 404/410. Sites that refuse robots answer 403 and are
      # reported without failing the run.
      - run: node scripts/check-links.mjs
